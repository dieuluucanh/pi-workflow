name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm test
      - run: npm ci
        working-directory: agent/extensions/workflow
      - run: npm ci
        working-directory: agent/extensions/autocompact
      - run: npm ci
        working-directory: agent/extensions/server-logs
      - run: npm ci
        working-directory: agent/extensions/browser-inspector
      - run: npm run verify
